tool: "coverage.py+beniget"
version: "coverage 7.14.1 / beniget 0.5.0"
language: python
language_version: "3.9"
technique: "Control Flow Testing + Data Flow Testing"
classification: "Coverage Reporting Validation"
target_files:
  - ../../catalog/pricing.py
  - ../../catalog/tests/test_pricing.py
run:
  command: "coverage run --branch -m pytest catalog/tests/test_pricing.py && coverage report -m && python quality/beniget/run_beniget.py"
requirements:
  - coverage==7.14.1
  - beniget==0.5.0
  - gast>=0.5.0
expects:
  branch_coverage_report_generated: true
  dead_def_report_generated: true
