tool: coverage.py
version: "7.14.1"
language: python
language_version: "3.9"
technique: "Control Flow Testing"
classification: "Statement / Branch Coverage"
target_files:
  - ../../catalog/pricing.py
  - ../../catalog/tests/test_pricing.py
run:
  command: "coverage run --branch -m pytest catalog/tests/test_pricing.py && coverage report -m"
requirements:
  - coverage==7.14.1
  - pytest-cov>=6.1.0
expects:
  statement_and_branch_coverage_report_generated: true
