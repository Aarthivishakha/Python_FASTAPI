tool: "coverage.py+beniget"
version: "coverage 7.14.1 / beniget 0.5.0"
language: python
language_version: "3.6"
technique: "Control Flow Testing + Data Flow Testing"
classification: "Coverage Reporting Validation"
target_files: ["app/**/*.py", "tests/**/*.py"]
run:
  command: "pytest --cov=app --cov-branch tests && python tool-triggers/scripts/run_beniget.py app"
requirements: ["coverage==7.14.1", "pytest-cov>=6.1.0", "beniget==0.5.0", "gast>=0.5.0"]
expects: {branch_coverage_report_generated: true, def_use_report_generated: true}
