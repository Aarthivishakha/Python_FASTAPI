tool: pylint
version: "4.0.6"
language: python
language_version: "3.14"
technique: "Static Code Analysis"
classification: "Lint / Rule Violations"
target_files: ["app/**/*.py", "tests/**/*.py"]
run:
  command: "pylint app tests --output-format=json"
requirements: ["pylint==4.0.6"]
expects: {lint_report_generated: true}
