tool: coverage.py
version: "7.14.1"
language: python
language_version: "3.7"
technique: "Control Flow Testing"
classification: "Statement / Branch Coverage"
target_files: ["app/**/*.py", "tests/**/*.py"]
run:
  command: "pytest --cov=app --cov-branch --cov-report=term-missing tests"
requirements: ["coverage==7.14.1", "pytest-cov>=6.1.0"]
expects: {statement_and_branch_coverage_report_generated: true}
